<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pinboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111
}
body{
  user-select:none;
  touch-action:none;
  cursor:grab
}

#view{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#171717
}

#board{
  position:absolute;
  left:0;
  top:0;
  width:14000px;
  height:12000px;
  background:#1b1b1b;
  transform-origin:0 0;
  will-change:transform
}

.photo{
  position:absolute;
  width:var(--w);
  height:var(--h);
  padding:14px 14px 34px;
  background:#eee;
  box-shadow:0 10px 28px #0008;
  cursor:pointer
}

.photo img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  background:#ddd;
  pointer-events:none
}

.pin{
  position:absolute;
  z-index:2;
  left:50%;
  top:-8px;
  width:15px;
  height:15px;
  transform:translateX(-50%);
  border-radius:50%;
  background:#aaa;
  box-shadow:0 2px 5px #000a
}

.viewer{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000f;
  z-index:10
}

.viewer.open{
  display:flex
}

.viewer img{
  max-width:94vw;
  max-height:94vh;
  object-fit:contain
}

.viewer button{
  position:absolute;
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  color:#fff;
  background:#ffffff1a;
  font-size:28px;
  cursor:pointer
}

#close{right:20px;top:20px}
#prev{left:20px;top:50%;transform:translateY(-50%)}
#next{right:20px;top:50%;transform:translateY(-50%)}

#loading{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  font-size:18px;
  transition:opacity .4s ease
}

#loading.hidden{
  opacity:0;
  pointer-events:none
}

#loadingText{
  text-align:center
}
</style>
</head>

<body>

<div id="loading">
  <div id="loadingText">Loading memories…</div>
</div>

<div id="view">
  <div id="board"></div>
</div>

<div class="viewer" id="viewer">
  <button id="close">×</button>
  <button id="prev">‹</button>
  <img id="big" alt="">
  <button id="next">›</button>
</div>

<script>

/*
=========================================================
AUTOMATIC GITHUB IMAGE DISCOVERY
=========================================================

Instead of guessing filenames, this finds every image
that actually exists in the same GitHub repository.

So filenames like:

11.jpg
12.jpg
...
199.jpg
1100.jpg
1101.jpg
...
1105.jpg

all work automatically.

It also works if the images have another extension such
as PNG, JPEG, WEBP, etc.
=========================================================
*/

const IMAGE_EXTENSIONS = [
  ".jpg",
  ".jpeg",
  ".png",
  ".webp",
  ".gif"
];

let photos = [];


/*
---------------------------------------------------------
Find the GitHub repository from the current GitHub Pages
URL.
---------------------------------------------------------
*/

function getGitHubRepo(){

  const host = location.hostname;
  const path = location.pathname;

  /*
    Normal project GitHub Pages:

    username.github.io/repository/

    OR:

    username.github.io/
  */

  if(host.endsWith(".github.io")){

    const username =
      host.replace(".github.io","");

    const parts =
      path.split("/").filter(Boolean);

    /*
      If this is username.github.io/repo/
      then repo is the first path component.
    */

    if(parts.length > 0){

      return {
        owner: username,
        repo: parts[0]
      };

    }

    /*
      User/organization page repository.
    */

    return {
      owner: username,
      repo: `${username}.github.io`
    };

  }

  return null;
}


/*
---------------------------------------------------------
Get actual files from GitHub.
---------------------------------------------------------
*/

async function findImages(){

  const repoInfo = getGitHubRepo();

  if(!repoInfo){

    throw new Error(
      "Could not determine the GitHub repository."
    );

  }


  const apiURL =
    `https://api.github.com/repos/${encodeURIComponent(repoInfo.owner)}/${encodeURIComponent(repoInfo.repo)}/contents/`;


  const response =
    await fetch(apiURL, {
      cache:"no-store"
    });


  if(!response.ok){

    throw new Error(
      `GitHub returned ${response.status}`
    );

  }


  const files = await response.json();


  if(!Array.isArray(files)){

    throw new Error(
      "GitHub did not return a file list."
    );

  }


  /*
    Keep only actual image files.
  */

  const images = files.filter(file => {

    if(file.type !== "file")
      return false;

    const name =
      file.name.toLowerCase();

    return IMAGE_EXTENSIONS.some(ext =>
      name.endsWith(ext)
    );

  });


  /*
    Sort naturally.

    This means:

    11
    12
    ...
    99
    110
    ...
    199
    1100
    ...

    instead of normal alphabetical sorting.
  */

  images.sort((a,b)=>{

    const na =
      parseInt(
        a.name.match(/\d+/)?.[0] || "0",
        10
      );

    const nb =
      parseInt(
        b.name.match(/\d+/)?.[0] || "0",
        10
      );

    if(na !== nb)
      return na - nb;

    return a.name.localeCompare(b.name);

  });


  return images.map(file => file.download_url);

}


/*
---------------------------------------------------------
Build the board.
---------------------------------------------------------
*/

const view =
  document.getElementById("view");

const board =
  document.getElementById("board");

let scale = .45;
let tx = -2500;
let ty = -1800;

let targetScale = .45;
let targetX = tx;
let targetY = ty;

let down = false;
let moved = false;
let wasDragging = false;

let lx = 0;
let ly = 0;

let current = 0;


function clamp(){

  const w = innerWidth;
  const h = innerHeight;
  const s = targetScale;

  targetX = Math.min(
    250,
    Math.max(
      w - 14000 * s - 250,
      targetX
    )
  );

  targetY = Math.min(
    200,
    Math.max(
      h - 12000 * s - 200,
      targetY
    )
  );

}


function build(){

  /*
    Number of columns.
    More columns means the board fills horizontally
    before going down.
  */

  const cols = 14;

  const sx = 650;
  const sy = 650;


  photos.forEach((src,i)=>{

    const el =
      document.createElement("div");

    el.className = "photo";


    const img =
      document.createElement("img");


    img.loading = "lazy";
    img.decoding = "async";
    img.src = src;
    img.alt = "";
    img.draggable = false;


    /*
      Automatically size each frame according
      to the actual image aspect ratio.
    */

    const setSize = ()=>{

      const nw =
        img.naturalWidth || 4;

      const nh =
        img.naturalHeight || 3;


      const maxSide = 430;
      const minSide = 210;

      const ratio =
        nw / nh;


      let w;
      let h;


      if(ratio >= 1){

        w = maxSide;
        h = w / ratio;

      }else{

        h = maxSide;
        w = h * ratio;

      }


      const minDim =
        Math.min(w,h);


      if(minDim < minSide){

        const k =
          minSide / minDim;

        w *= k;
        h *= k;

      }


      const pad = 14;
      const bottom = 34;


      el.style.setProperty(
        "--w",
        Math.round(w + pad * 2) + "px"
      );

      el.style.setProperty(
        "--h",
        Math.round(h + pad * 2 + bottom) + "px"
      );

    };


    img.addEventListener(
      "load",
      setSize
    );


    /*
      If one image fails, it doesn't
      break the entire board.
    */

    img.addEventListener(
      "error",
      ()=>{
        console.warn(
          "Failed to load:",
          src
        );
      }
    );


    setSize();


    const col =
      i % cols;

    const row =
      Math.floor(i / cols);


    el.style.left =
      (
        430 +
        col * sx +
        ((i * 37) % 100 - 50)
      ) + "px";


    el.style.top =
      (
        300 +
        row * sy +
        ((i * 29) % 100 - 50)
      ) + "px";


    el.style.transform =
      `rotate(${((i * 17) % 9) - 4}deg)`;


    el.innerHTML =
      '<span class="pin"></span>';


    el.appendChild(img);

    board.appendChild(el);


    el.onclick = ()=>{

      if(!moved && !wasDragging){

        openViewer(i);

      }

    };

  });

}


/*
---------------------------------------------------------
Animation
---------------------------------------------------------
*/

function render(){

  scale +=
    (targetScale - scale) * .18;

  tx +=
    (targetX - tx) * .18;

  ty +=
    (targetY - ty) * .18;


  board.style.transform =
    `translate3d(${tx}px,${ty}px,0) scale(${scale})`;


  requestAnimationFrame(render);

}


/*
---------------------------------------------------------
Dragging
---------------------------------------------------------
*/

view.onpointerdown = e =>{

  if(e.button !== 0)
    return;


  down = true;
  moved = false;


  lx = e.clientX;
  ly = e.clientY;


  view.setPointerCapture(
    e.pointerId
  );

};


view.onpointermove = e =>{

  if(!down)
    return;


  const dx =
    e.clientX - lx;

  const dy =
    e.clientY - ly;


  if(
    Math.abs(dx) > 3 ||
    Math.abs(dy) > 3
  ){

    moved = true;
    wasDragging = true;

  }


  targetX += dx;
  targetY += dy;


  clamp();


  lx = e.clientX;
  ly = e.clientY;

};


view.onpointerup = e =>{

  down = false;


  if(
    view.hasPointerCapture(
      e.pointerId
    )
  ){

    view.releasePointerCapture(
      e.pointerId
    );

  }


  setTimeout(()=>{

    moved = false;
    wasDragging = false;

  },80);

};


/*
---------------------------------------------------------
Zoom
---------------------------------------------------------
*/

view.onwheel = e =>{

  e.preventDefault();


  const old =
    targetScale;


  const f =
    Math.exp(
      -e.deltaY * .0012
    );


  targetScale =
    Math.max(
      .12,
      Math.min(
        3.2,
        old * f
      )
    );


  const r =
    view.getBoundingClientRect();


  const mx =
    e.clientX - r.left;

  const my =
    e.clientY - r.top;


  const bx =
    (mx - targetX) / old;

  const by =
    (my - targetY) / old;


  targetX =
    mx - bx * targetScale;

  targetY =
    my - by * targetScale;


  clamp();

};


/*
---------------------------------------------------------
Keyboard
---------------------------------------------------------
*/

window.onkeydown = e =>{

  if(viewer.classList.contains("open")){

    if(e.key === "Escape")
      closeViewer();

    if(e.key === "ArrowRight")
      next();

    if(e.key === "ArrowLeft")
      prev();

    return;

  }


  const p = 100;


  if(e.key === "ArrowLeft")
    targetX += p;

  if(e.key === "ArrowRight")
    targetX -= p;

  if(e.key === "ArrowUp")
    targetY += p;

  if(e.key === "ArrowDown")
    targetY -= p;


  if(
    e.key === "+" ||
    e.key === "="
  ){

    targetScale =
      Math.min(
        3.2,
        targetScale * 1.15
      );

  }


  if(
    e.key === "-" ||
    e.key === "_"
  ){

    targetScale =
      Math.max(
        .12,
        targetScale / 1.15
      );

  }


  clamp();

};


/*
---------------------------------------------------------
Viewer
---------------------------------------------------------
*/

const viewer =
  document.getElementById("viewer");

const big =
  document.getElementById("big");


function openViewer(i){

  current = i;

  big.src =
    photos[current];

  viewer.classList.add("open");

}


function closeViewer(){

  viewer.classList.remove(
    "open"
  );

  big.removeAttribute("src");

}


function next(){

  current =
    (current + 1) %
    photos.length;

  big.src =
    photos[current];

}


function prev(){

  current =
    (
      current -
      1 +
      photos.length
    ) % photos.length;

  big.src =
    photos[current];

}


document.getElementById("close")
  .onclick = closeViewer;

document.getElementById("next")
  .onclick = next;

document.getElementById("prev")
  .onclick = prev;


viewer.onclick = e =>{

  if(e.target === viewer)
    closeViewer();

};


/*
=========================================================
START
=========================================================
*/

(async()=>{

  const loadingText =
    document.getElementById("loadingText");

  try{

    loadingText.textContent =
      "Finding your pictures…";


    photos = await findImages();


    if(!photos.length){

      throw new Error(
        "No image files were found in the repository."
      );

    }


    loadingText.textContent =
      `Found ${photos.length} pictures…`;


    build();
    clamp();
    render();


    setTimeout(()=>{

      document
        .getElementById("loading")
        .classList.add("hidden");

    },500);


    console.log(
      `Loaded ${photos.length} images`
    );

    console.log(photos);

  }catch(error){

    console.error(error);


    loadingText.innerHTML =
      `
      <div>
        <b>Couldn't load the pictures.</b>
        <br><br>
        ${error.message}
        <br><br>
        Open the browser console (F12) for details.
      </div>
      `;

  }

})();

</script>

</body>
</html>
